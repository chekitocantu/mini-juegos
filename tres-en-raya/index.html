<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tres en raya — BrowserLab</title>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    body {
      background:#1a1a2e; color:#eee;
      font-family:'Courier New',monospace;
      display:flex; flex-direction:column; align-items:center;
      justify-content:center; min-height:100vh; gap:14px;
      padding:70px 20px 20px;
    }

    .back-home {
      position:fixed; top:18px; left:18px;
      padding:8px 14px;
      background:#3d4f3a;
      border:1px solid #6b8568;
      border-radius:8px;
      color:#c5d8c0;
      text-decoration:none;
      font-family:'Courier New',monospace;
      font-size:13px; letter-spacing:1px; font-weight:bold;
      transition:background .2s, color .2s, border-color .2s;
      z-index:20;
    }
    .back-home:hover { background:#4d6549; color:#fff; border-color:#8ba888; }

    #topbar { width:332px; display:flex; justify-content:space-between; align-items:center; }
    #game-label { font-size:13px; letter-spacing:3px; color:#f97316; font-weight:bold; }

    #turn-row {
      width:332px; display:flex; justify-content:center; align-items:center; gap:14px;
      background:#16213e; border:1px solid #4a4a8a; border-radius:8px;
      padding:10px 16px;
    }
    .turn-label { font-size:11px; letter-spacing:2px; color:#8888cc; text-transform:uppercase; }
    .turn-value { font-size:24px; font-weight:bold; transition:color .2s; }
    .turn-value.x { color:#f97316; }
    .turn-value.o { color:#3b82f6; }

    #board {
      display:grid;
      grid-template-columns:repeat(3, 100px);
      grid-template-rows:repeat(3, 100px);
      gap:8px; padding:8px;
      background:#0f1629;
      border-radius:12px;
      border:2px solid #4a4a8a;
      box-shadow:0 0 30px #4a4a8a88;
    }

    .cell {
      background:#1a1a2e;
      border:3px solid transparent;
      border-radius:8px;
      display:flex; align-items:center; justify-content:center;
      font-size:60px; font-weight:bold;
      cursor:pointer; user-select:none;
      transition:border-color .15s, background .2s, transform .1s;
    }
    .cell:hover:not(.x):not(.o) { background:#222244; }
    .cell.selected {
      border-color:#6b8568;
      box-shadow:0 0 14px #6b8568aa;
    }
    .cell.x { color:#f97316; }
    .cell.o { color:#3b82f6; }
    .cell.winning {
      background:#2a3d2a;
      border-color:#8ba888;
      animation:pulse 0.6s ease-out;
    }
    @keyframes pulse {
      0% { transform:scale(1); }
      50% { transform:scale(1.06); }
      100% { transform:scale(1); }
    }

    #scores { width:332px; display:flex; gap:8px; }
    .score {
      flex:1; background:#16213e; border:1px solid #4a4a8a;
      border-radius:6px; padding:8px 6px; text-align:center;
    }
    .score-label { font-size:10px; letter-spacing:2px; color:#8888cc; text-transform:uppercase; }
    .score-value { font-size:22px; font-weight:bold; color:#fff; margin-top:2px; }
    .score.x .score-label { color:#f97316; }
    .score.o .score-label { color:#3b82f6; }

    #hint { font-size:11px; color:#555; text-align:center; }
    #hint kbd {
      background:#16213e; border:1px solid #4a4a8a; border-radius:3px;
      padding:1px 6px; font-family:inherit; font-size:10px; color:#aaa;
    }

    /* Overlay */
    #overlay {
      position:fixed; inset:0; background:#000a;
      display:flex; flex-direction:column;
      justify-content:center; align-items:center;
      gap:14px; z-index:10;
    }
    #overlay h1 { font-size:38px; letter-spacing:5px; color:#fff; text-shadow:0 0 20px #f97316; }
    #overlay .overlay-sub { color:#aaa; font-size:13px; text-align:center; line-height:1.6; max-width:320px; }

    .menu-actions {
      display:flex; flex-direction:column; gap:8px;
      width:280px; margin-top:6px;
    }

    .mode-select {
      display:flex; gap:8px; width:100%;
    }
    .mode-btn {
      flex:1; padding:10px 8px; font-family:inherit; font-size:12px;
      font-weight:bold; letter-spacing:1px;
      background:#16213e; color:#8888cc;
      border:1px solid #4a4a8a; border-radius:8px;
      cursor:pointer; transition:all .2s; text-align:center;
    }
    .mode-btn:hover { background:#1e2d50; color:#fff; }
    .mode-btn.active { background:#f97316; color:#000; border-color:#f97316; }

    .ai-levels {
      display:none; flex-direction:column; gap:6px; width:100%;
    }
    .ai-levels.show { display:flex; }
    .ai-level-btn {
      padding:8px 12px; font-family:inherit; font-size:11px;
      font-weight:bold; letter-spacing:1px;
      background:#16213e; color:#8888cc;
      border:1px solid #4a4a8a; border-radius:8px;
      cursor:pointer; transition:all .2s; text-align:left;
    }
    .ai-level-btn:hover { background:#1e2d50; color:#fff; }
    .ai-level-btn.active { background:#f97316; color:#000; border-color:#f97316; }
    .ai-level-btn small { display:block; font-weight:normal; font-size:10px; color:#777; margin-top:2px; }
    .ai-level-btn.active small { color:#333; }

    .btn-primary, .btn-secondary {
      padding:12px 24px; font-size:15px; font-family:inherit;
      border-radius:8px; cursor:pointer;
      letter-spacing:2px; font-weight:bold;
      text-align:center; text-decoration:none;
      display:block; transition:all .2s;
    }
    .btn-primary { background:#f97316; color:#000; border:none; }
    .btn-primary:hover { background:#fb923c; }
    .btn-secondary {
      background:transparent; color:#888;
      border:1px solid #4a4a8a;
      font-size:12px; font-weight:normal; letter-spacing:1px;
    }
    .btn-secondary:hover { background:#16213e; color:#aaa; }

    .hidden { display:none !important; }
  </style>
</head>
<body>

<a class="back-home" href="../">← BrowserLab</a>

<div id="overlay">
  <h1>TRES EN RAYA</h1>
  <p class="overlay-sub" id="overlay-sub">X empieza · Llega a 3 en línea</p>

  <div class="menu-actions">
    <div class="mode-select">
      <button class="mode-btn active" data-mode="pvp">2 Jugadores</button>
      <button class="mode-btn" data-mode="ai">vs Máquina</button>
    </div>

    <div class="ai-levels" id="ai-levels">
      <button class="ai-level-btn active" data-level="1">
        Nivel 1 — Novato
        <small>Juega al azar</small>
      </button>
      <button class="ai-level-btn" data-level="2">
        Nivel 2 — Normal
        <small>Bloquea y ataca si puede</small>
      </button>
      <button class="ai-level-btn" data-level="3">
        Nivel 3 — Difícil
        <small>Casi perfecto, algún error</small>
      </button>
      <button class="ai-level-btn" data-level="4">
        Nivel 4 — Imposible
        <small>Minimax perfecto, nunca pierde</small>
      </button>
    </div>

    <button id="start-btn" class="btn-primary">▶ JUGAR</button>
    <a class="btn-secondary" href="../">← Volver al inicio</a>
  </div>
</div>

<div id="topbar">
  <span></span>
  <span id="game-label">TRES EN RAYA</span>
  <span></span>
</div>

<div id="turn-row">
  <span class="turn-label">Turno de:</span>
  <span class="turn-value x" id="turn">X</span>
</div>

<div id="board">
  <div class="cell" data-i="0"></div>
  <div class="cell" data-i="1"></div>
  <div class="cell" data-i="2"></div>
  <div class="cell" data-i="3"></div>
  <div class="cell" data-i="4"></div>
  <div class="cell" data-i="5"></div>
  <div class="cell" data-i="6"></div>
  <div class="cell" data-i="7"></div>
  <div class="cell" data-i="8"></div>
</div>

<div id="scores">
  <div class="score x">
    <div class="score-label" id="label-x">X gana</div>
    <div class="score-value" id="score-x">0</div>
  </div>
  <div class="score o">
    <div class="score-label" id="label-o">O gana</div>
    <div class="score-value" id="score-o">0</div>
  </div>
  <div class="score">
    <div class="score-label">Empates</div>
    <div class="score-value" id="score-d">0</div>
  </div>
</div>

<div id="hint">
  <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> mover  ·
  <kbd>Enter</kbd> colocar  ·
  <kbd>R</kbd> reiniciar marcador
</div>

<script>
const cells = document.querySelectorAll('.cell');
const LINES = [
  [0,1,2],[3,4,5],[6,7,8],
  [0,3,6],[1,4,7],[2,5,8],
  [0,4,8],[2,4,6]
];

let board, cursor, current, over;
let vsAI = false;
let aiLevel = 1;
let aiThinking = false;
let scores = JSON.parse(localStorage.getItem('ttt-scores') || '{"X":0,"O":0,"D":0}');

// Setup UI
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelector('.mode-btn.active').classList.remove('active');
    btn.classList.add('active');
    document.getElementById('ai-levels').classList.toggle('show', btn.dataset.mode === 'ai');
  });
});

document.querySelectorAll('.ai-level-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelector('.ai-level-btn.active').classList.remove('active');
    btn.classList.add('active');
  });
});

function init() {
  vsAI = document.querySelector('.mode-btn.active').dataset.mode === 'ai';
  aiLevel = parseInt(document.querySelector('.ai-level-btn.active').dataset.level);
  aiThinking = false;

  if (vsAI) {
    document.getElementById('label-o').textContent = `Máquina Nv.${aiLevel}`;
  } else {
    document.getElementById('label-o').textContent = 'O gana';
  }

  board   = Array(9).fill(null);
  cursor  = 4;
  current = 'X';
  over    = false;
  render();
}

function render() {
  cells.forEach((cell, i) => {
    cell.classList.remove('selected','x','o','winning');
    cell.textContent = board[i] || '';
    if (board[i] === 'X') cell.classList.add('x');
    if (board[i] === 'O') cell.classList.add('o');
    if (i === cursor && !over) cell.classList.add('selected');
  });
  const turnEl = document.getElementById('turn');
  if (vsAI && current === 'O') {
    turnEl.textContent = 'MÁQUINA';
  } else {
    turnEl.textContent = current;
  }
  turnEl.className = 'turn-value ' + current.toLowerCase();
}

function updateScores() {
  document.getElementById('score-x').textContent = scores.X;
  document.getElementById('score-o').textContent = scores.O;
  document.getElementById('score-d').textContent = scores.D;
}
updateScores();

function checkWin() {
  for (const line of LINES) {
    const [a,b,c] = line;
    if (board[a] && board[a] === board[b] && board[a] === board[c]) {
      return { winner: board[a], line };
    }
  }
  return null;
}

function place(pos) {
  if (over || board[pos] !== null) return;
  if (aiThinking) return;
  board[pos] = current;

  const win = checkWin();
  if (win) {
    over = true;
    scores[win.winner]++;
    localStorage.setItem('ttt-scores', JSON.stringify(scores));
    render();
    win.line.forEach(i => cells[i].classList.add('winning'));
    updateScores();
    const label = vsAI && win.winner === 'O' ? 'MÁQUINA GANA' : `¡${win.winner} GANA!`;
    setTimeout(() => showOverlay(label,
      `X ${scores.X}  ·  O ${scores.O}  ·  Empates ${scores.D}`
    ), 700);
    return;
  }

  if (board.every(c => c)) {
    over = true;
    scores.D++;
    localStorage.setItem('ttt-scores', JSON.stringify(scores));
    updateScores();
    render();
    setTimeout(() => showOverlay('EMPATE',
      `X ${scores.X}  ·  O ${scores.O}  ·  Empates ${scores.D}`
    ), 400);
    return;
  }

  current = current === 'X' ? 'O' : 'X';
  render();

  if (vsAI && current === 'O' && !over) {
    aiThinking = true;
    setTimeout(() => {
      const move = aiChooseMove();
      cursor = move;
      aiThinking = false;
      place(move);
    }, 400);
  }
}

function showOverlay(title, sub) {
  const ol = document.getElementById('overlay');
  ol.querySelector('h1').textContent = title;
  document.getElementById('overlay-sub').textContent = sub;
  document.getElementById('start-btn').textContent = '▶ JUGAR DE NUEVO';
  ol.classList.remove('hidden');
}

// ── AI ──
function getEmpty() {
  return board.map((v, i) => v === null ? i : -1).filter(i => i >= 0);
}

function findWinMove(player) {
  for (const line of LINES) {
    const vals = line.map(i => board[i]);
    const mine = vals.filter(v => v === player).length;
    const empty = vals.filter(v => v === null).length;
    if (mine === 2 && empty === 1) {
      return line.find(i => board[i] === null);
    }
  }
  return -1;
}

function minimax(b, isMax, depth) {
  const win = checkWinBoard(b);
  if (win === 'O') return 10 - depth;
  if (win === 'X') return depth - 10;
  const empty = b.map((v, i) => v === null ? i : -1).filter(i => i >= 0);
  if (empty.length === 0) return 0;

  if (isMax) {
    let best = -Infinity;
    for (const i of empty) {
      b[i] = 'O';
      best = Math.max(best, minimax(b, false, depth + 1));
      b[i] = null;
    }
    return best;
  } else {
    let best = Infinity;
    for (const i of empty) {
      b[i] = 'X';
      best = Math.min(best, minimax(b, true, depth + 1));
      b[i] = null;
    }
    return best;
  }
}

function checkWinBoard(b) {
  for (const [a, c2, c3] of LINES) {
    if (b[a] && b[a] === b[c2] && b[a] === b[c3]) return b[a];
  }
  return null;
}

function aiChooseMove() {
  const empty = getEmpty();
  if (empty.length === 0) return -1;

  if (aiLevel === 1) {
    return empty[Math.floor(Math.random() * empty.length)];
  }

  if (aiLevel === 2) {
    let m = findWinMove('O');
    if (m >= 0) return m;
    m = findWinMove('X');
    if (m >= 0) return m;
    if (board[4] === null) return 4;
    return empty[Math.floor(Math.random() * empty.length)];
  }

  if (aiLevel === 3) {
    if (Math.random() < 0.15) {
      return empty[Math.floor(Math.random() * empty.length)];
    }
  }

  // Level 3 (mostly) and 4: full minimax
  let bestScore = -Infinity;
  let bestMove = empty[0];
  const b = [...board];
  for (const i of empty) {
    b[i] = 'O';
    const score = minimax(b, false, 0);
    b[i] = null;
    if (score > bestScore) {
      bestScore = score;
      bestMove = i;
    }
  }
  return bestMove;
}

// ── Controls ──
document.addEventListener('keydown', e => {
  if (e.code === 'KeyR') {
    e.preventDefault();
    scores = { X:0, O:0, D:0 };
    localStorage.setItem('ttt-scores', JSON.stringify(scores));
    updateScores();
    return;
  }

  if (over || aiThinking) return;
  if (!document.getElementById('overlay').classList.contains('hidden')) return;

  switch (e.code) {
    case 'ArrowLeft':  e.preventDefault(); if (cursor % 3 > 0) cursor--; break;
    case 'ArrowRight': e.preventDefault(); if (cursor % 3 < 2) cursor++; break;
    case 'ArrowUp':    e.preventDefault(); if (cursor >= 3)    cursor -= 3; break;
    case 'ArrowDown':  e.preventDefault(); if (cursor < 6)     cursor += 3; break;
    case 'Enter':
    case 'Space':      e.preventDefault(); place(cursor); return;
    default: return;
  }
  render();
});

cells.forEach((cell, i) => {
  cell.addEventListener('click', () => {
    if (over || aiThinking) return;
    if (!document.getElementById('overlay').classList.contains('hidden')) return;
    cursor = i;
    place(cursor);
  });
});

document.getElementById('start-btn').addEventListener('click', () => {
  document.getElementById('overlay').classList.add('hidden');
  init();
});
</script>
</body>
</html>
