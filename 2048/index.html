<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048 — BrowserLab</title>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    body {
      background:#1a1a2e; color:#eee;
      font-family:'Courier New',monospace;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      min-height:100vh; gap:12px;
    }

    :root { --w: min(400px, 90vw); --tile: calc((var(--w) - 20px - 30px) / 4); }

    #topbar {
      width:var(--w); display:flex;
      justify-content:space-between; align-items:center;
    }
    .back-home {
      position:fixed; top:18px; left:18px;
      padding:8px 14px;
      background:#3d4f3a;
      border:1px solid #6b8568;
      border-radius:8px;
      color:#c5d8c0;
      text-decoration:none;
      font-family:'Courier New',monospace;
      font-size:13px; letter-spacing:1px; font-weight:bold;
      transition:background .2s, color .2s, border-color .2s;
      z-index:20;
    }
    .back-home:hover { background:#4d6549; color:#fff; border-color:#8ba888; }
    #game-label { font-size:13px; letter-spacing:3px; color:#eab308; font-weight:bold; }

    #hud { width:var(--w); display:flex; gap:8px; }
    .panel {
      flex:1; background:#16213e; border:1px solid #4a4a8a;
      border-radius:6px; padding:6px 10px; text-align:center;
    }
    .panel h3 { font-size:9px; letter-spacing:2px; text-transform:uppercase; color:#8888cc; margin-bottom:2px; }
    .panel .val { font-size:20px; font-weight:bold; color:#fff; }

    #new-btn {
      padding:7px 16px; font-family:inherit; font-size:12px;
      font-weight:bold; letter-spacing:1px;
      background:#2a2a5a; border:1px solid #4a4a8a;
      color:#aaa; border-radius:6px; cursor:pointer;
      transition:background .2s, color .2s;
    }
    #new-btn:hover { background:#3a3a7a; color:#fff; }

    /* Board */
    #board-wrap {
      background:#0f1629;
      border:2px solid #4a4a8a;
      border-radius:10px;
      padding:10px;
      box-shadow:0 0 30px #4a4a8a88;
    }
    #grid {
      display:grid;
      grid-template-columns:repeat(4, var(--tile));
      grid-template-rows:repeat(4, var(--tile));
      gap:10px;
    }

    .cell {
      width:var(--tile); height:var(--tile);
      border-radius:8px;
      display:flex; align-items:center; justify-content:center;
      font-weight:800; font-size:calc(var(--tile) * 0.31);
      transition:background-color .1s, color .1s;
      position:relative;
      background:#1a1a38;
    }

    /* Tile pop animation */
    @keyframes pop {
      0%   { transform:scale(0.5); }
      60%  { transform:scale(1.1); }
      100% { transform:scale(1); }
    }
    @keyframes merge {
      0%   { transform:scale(1); }
      50%  { transform:scale(1.2); }
      100% { transform:scale(1); }
    }
    .cell.new   { animation:pop   .15s ease-out; }
    .cell.merge { animation:merge .15s ease-out; }

    /* Tile colors */
    .t-0    { background:#1a1a38; color:transparent; }
    .t-2    { background:#2e2e5e; color:#c0c0ff; }
    .t-4    { background:#3c3c7e; color:#d0d0ff; }
    .t-8    { background:#b45309; color:#fff; }
    .t-16   { background:#b91c1c; color:#fff; font-size:calc(var(--tile) * 0.27); }
    .t-32   { background:#7c3aed; color:#fff; font-size:calc(var(--tile) * 0.27); }
    .t-64   { background:#6d28d9; color:#fff; font-size:calc(var(--tile) * 0.27); }
    .t-128  { background:#ca8a04; color:#fff; font-size:calc(var(--tile) * 0.22); }
    .t-256  { background:#c2410c; color:#fff; font-size:calc(var(--tile) * 0.22); }
    .t-512  { background:#15803d; color:#fff; font-size:calc(var(--tile) * 0.22); }
    .t-1024 { background:#0369a1; color:#fff; font-size:calc(var(--tile) * 0.18); }
    .t-2048 { background:#f59e0b; color:#1a0a00; font-size:calc(var(--tile) * 0.18);
              box-shadow:0 0 20px #f59e0b88; }

    #hint { font-size:11px; color:#555; }

    /* Overlay */
    #overlay {
      position:fixed; inset:0; background:#000b;
      display:flex; flex-direction:column;
      justify-content:center; align-items:center;
      gap:14px; z-index:10;
    }
    #overlay h1 { font-size:40px; letter-spacing:6px; color:#fff; text-shadow:0 0 20px #eab308; }
    #overlay p  { color:#aaa; font-size:13px; text-align:center; line-height:1.8; }
    .menu-actions {
      display:flex; flex-direction:column; gap:8px;
      width:240px; margin-top:6px;
    }
    .btn-primary, .btn-secondary {
      padding:12px 24px; font-size:15px; font-family:inherit;
      border-radius:8px; cursor:pointer;
      letter-spacing:2px; font-weight:bold;
      text-align:center; text-decoration:none;
      display:block; transition:all .2s;
    }
    .btn-primary { background:#ca8a04; color:#fff; border:none; }
    .btn-primary:hover { background:#f59e0b; }
    .btn-secondary {
      background:transparent; color:#888;
      border:1px solid #4a4a8a;
      font-size:12px; font-weight:normal; letter-spacing:1px;
    }
    .btn-secondary:hover { background:#16213e; color:#aaa; }
    .hidden { display:none !important; }

    #mute-btn {
      padding:7px 12px; font-size:16px;
      background:#2a2a5a; border:1px solid #4a4a8a;
      border-radius:6px; color:#aaa; cursor:pointer;
      font-family:inherit; transition:background .2s, color .2s;
    }
    #mute-btn:hover { background:#3a3a7a; color:#fff; }
  </style>
</head>
<body>

<div id="overlay">
  <h1>2048</h1>
  <p>← → ↑ ↓  para deslizar · Swipe en móvil<br>Combina fichas iguales para llegar al <strong style="color:#f59e0b">2048</strong></p>
  <div class="menu-actions">
    <button id="start-btn" class="btn-primary">▶ JUGAR</button>
    <a class="btn-secondary" href="../">← Volver al inicio</a>
  </div>
</div>

<a class="back-home" href="../">← BrowserLab</a>

<div id="topbar">
  <button id="mute-btn" onclick="toggleMute()">🔊</button>
  <span id="game-label">2048</span>
  <button id="new-btn">Nueva partida</button>
</div>

<div id="hud">
  <div class="panel"><h3>Puntos</h3><div class="val" id="score">0</div></div>
  <div class="panel"><h3>Mejor</h3><div class="val" id="best">0</div></div>
</div>

<div id="board-wrap">
  <div id="grid"></div>
</div>
<div id="hint">↑ ↓ ← →  /  Swipe para deslizar</div>

<script>
// ─── AUDIO: "Gymnopédie No. 1" (Erik Satie, 1888 - dominio público)
const BPM = 72, BS = 60/BPM;
const NF = {
  'G2':97.999,'D3':146.83,'A3':220.00,
  'D4':293.66,'F#4':369.99,'A4':440.00,'B4':493.88,
  'C#5':554.37,'D5':587.33,'E5':659.25,'F#5':739.99,'G5':783.99,
};
// Melodía: tres pulsos en blanco, luego entra (3/4 = 3 beats por compás)
const MELODY = [
  [null,6],
  ['F#5',3],['F#5',3],
  ['E5',1.5],['D5',1.5],['C#5',1.5],['D5',1.5],
  ['E5',3],['F#5',3],
  ['G5',1.5],['F#5',1.5],['E5',1.5],['D5',1.5],
  ['C#5',3],['D5',3],
];
// Bajo arpegiado característico de la Gymnopédie (G - chord - chord)
const BASS = [
  ['G2',1],['D4',1],['B4',1],  ['G2',1],['D4',1],['B4',1],
  ['G2',1],['D4',1],['B4',1],  ['G2',1],['D4',1],['B4',1],
  ['D3',1],['A3',1],['F#4',1], ['D3',1],['A3',1],['F#4',1],
  ['D3',1],['A3',1],['F#4',1], ['D3',1],['A3',1],['F#4',1],
  ['G2',1],['D4',1],['B4',1],  ['G2',1],['D4',1],['B4',1],
  ['D3',1],['A3',1],['F#4',1], ['D3',1],['A3',1],['F#4',1],
];
let audioCtx, masterGain, loopTimer, loopStart;
let muted = localStorage.getItem('audio-muted') === 'true';

function ensureAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = muted ? 0 : 0.45;
  masterGain.connect(audioCtx.destination);
}
function scheduleNote(freq, t, dur, type, vol) {
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.connect(g); g.connect(masterGain);
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.15); // ataque lento (calma)
  g.gain.setValueAtTime(vol, t + dur * 0.65);
  g.gain.linearRampToValueAtTime(0, t + dur * 0.98);
  o.start(t); o.stop(t + dur);
}
function scheduleLoop(startAt) {
  let total = 0;
  MELODY.forEach(([,b]) => total += b);
  let mt = startAt;
  MELODY.forEach(([n,b]) => {
    if (n && NF[n]) scheduleNote(NF[n], mt, b*BS*0.95, 'triangle', 0.13);
    mt += b*BS;
  });
  let bt = startAt;
  BASS.forEach(([n,b]) => {
    if (n && NF[n]) scheduleNote(NF[n], bt, b*BS*0.9, 'sine', 0.20);
    bt += b*BS;
  });
  return startAt + total*BS;
}
function startMusic() {
  ensureAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  clearTimeout(loopTimer);
  masterGain.gain.value = muted ? 0 : 0.45;
  loopStart = audioCtx.currentTime + 0.05;
  function loop() {
    loopStart = scheduleLoop(loopStart);
    const wait = (loopStart - audioCtx.currentTime - 0.4) * 1000;
    loopTimer = setTimeout(loop, Math.max(50, wait));
  }
  loop();
}
function stopMusic() { clearTimeout(loopTimer); loopTimer = null; }
function toggleMute() {
  muted = !muted;
  localStorage.setItem('audio-muted', muted);
  document.getElementById('mute-btn').textContent = muted ? '🔇' : '🔊';
  if (masterGain) masterGain.gain.value = muted ? 0 : 0.45;
}
window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('mute-btn').textContent = muted ? '🔇' : '🔊';
});

// ── STATE ─────────────────────────────────────────────
let board, score, won;
let best = +localStorage.getItem('2048-best') || 0;
document.getElementById('best').textContent = best;

function newBoard() {
  board = Array.from({length:4}, () => Array(4).fill(0));
  score = 0; won = false;
  addTile(); addTile();
  render();
  updateHUD();
}

function addTile() {
  const empty = [];
  board.forEach((row,r) => row.forEach((v,c) => { if (!v) empty.push([r,c]); }));
  if (!empty.length) return false;
  const [r,c] = empty[Math.floor(Math.random() * empty.length)];
  board[r][c] = Math.random() < 0.9 ? 2 : 4;
  return {r, c};
}

// ── SLIDE LOGIC ───────────────────────────────────────
function slideRow(row) {
  const nums = row.filter(v => v !== 0);
  const merged = [];
  const mergedIdx = new Set();
  let pts = 0;
  for (let i = 0; i < nums.length; i++) {
    if (!mergedIdx.has(i) && i+1 < nums.length && nums[i] === nums[i+1]) {
      merged.push(nums[i] * 2);
      pts += nums[i] * 2;
      mergedIdx.add(i+1);
      i++;
    } else {
      merged.push(nums[i]);
    }
  }
  while (merged.length < 4) merged.push(0);
  return { row: merged, pts, changed: merged.join() !== row.join() };
}

function transpose(b) {
  return b[0].map((_, c) => b.map(row => row[c]));
}

function move(dir) {
  let changed = false, pts = 0;
  let b = board.map(r => [...r]);

  if (dir === 'left') {
    b = b.map(row => { const r = slideRow(row); pts+=r.pts; changed=changed||r.changed; return r.row; });
  } else if (dir === 'right') {
    b = b.map(row => { const rev=slideRow([...row].reverse()); pts+=rev.pts; changed=changed||rev.changed; return rev.row.reverse(); });
  } else if (dir === 'up') {
    b = transpose(transpose(b).map(row => { const r=slideRow(row); pts+=r.pts; changed=changed||r.changed; return r.row; }));
  } else if (dir === 'down') {
    b = transpose(transpose(b).map(row => { const rev=slideRow([...row].reverse()); pts+=rev.pts; changed=changed||rev.changed; return rev.row.reverse(); }));
  }

  if (!changed) return;

  board = b;
  score += pts;
  if (score > best) { best = score; localStorage.setItem('2048-best', best); }
  updateHUD();

  const newCell = addTile();
  render(newCell);

  if (!won && board.some(row => row.some(v => v === 2048))) {
    won = true;
    setTimeout(() => showOverlay('¡LO LOGRASTE!', '¡Llegaste al 2048! Puedes seguir jugando.', '▶ CONTINUAR'), 300);
  } else if (isGameOver()) {
    stopMusic();
    setTimeout(() => showOverlay('GAME OVER', `Puntuación final: ${score}`, '▶ JUGAR DE NUEVO'), 300);
  }
}

function isGameOver() {
  for (let r = 0; r < 4; r++)
    for (let c = 0; c < 4; c++) {
      if (board[r][c] === 0) return false;
      if (c+1 < 4 && board[r][c] === board[r][c+1]) return false;
      if (r+1 < 4 && board[r][c] === board[r+1][c]) return false;
    }
  return true;
}

// ── RENDER ────────────────────────────────────────────
function render(newCell) {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  board.forEach((row, r) => {
    row.forEach((v, c) => {
      const cell = document.createElement('div');
      const cls = v > 2048 ? 't-2048' : `t-${v}`;
      cell.className = `cell ${cls}`;
      if (v) cell.textContent = v;
      if (newCell && newCell.r === r && newCell.c === c) cell.classList.add('new');
      grid.appendChild(cell);
    });
  });
}

function updateHUD() {
  document.getElementById('score').textContent = score;
  document.getElementById('best').textContent  = best;
}

function showOverlay(title, msg, btn) {
  const ol = document.getElementById('overlay');
  ol.querySelector('h1').textContent     = title;
  ol.querySelector('p').textContent      = msg;
  ol.querySelector('#start-btn').textContent = btn;
  ol.classList.remove('hidden');
}

// ── CONTROLS ──────────────────────────────────────────
document.addEventListener('keydown', e => {
  const map = { ArrowLeft:'left', ArrowRight:'right', ArrowUp:'up', ArrowDown:'down' };
  if (map[e.code]) { e.preventDefault(); move(map[e.code]); }
});

// Touch swipe
let tx = null, ty = null;
const boardWrap = document.getElementById('board-wrap');
boardWrap.addEventListener('touchstart', e => {
  e.preventDefault();
  tx = e.touches[0].clientX;
  ty = e.touches[0].clientY;
}, {passive: false});
boardWrap.addEventListener('touchmove', e => { e.preventDefault(); }, {passive: false});
boardWrap.addEventListener('touchend', e => {
  e.preventDefault();
  if (tx===null) return;
  const dx = e.changedTouches[0].clientX - tx;
  const dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > Math.abs(dy)) {
    move(dx > 20 ? 'right' : dx < -20 ? 'left' : null);
  } else {
    move(dy > 20 ? 'down' : dy < -20 ? 'up' : null);
  }
  tx = ty = null;
}, {passive: false});

// Buttons
document.getElementById('start-btn').addEventListener('click', () => {
  document.getElementById('overlay').classList.add('hidden');
  newBoard();
  startMusic();
});
document.getElementById('new-btn').addEventListener('click', () => {
  document.getElementById('overlay').classList.add('hidden');
  newBoard();
  startMusic();
});
</script>
</body>
</html>
